pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://files.minecraftforge.net/maven/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'somestacks'
include 'common'
def platforms = enabled_platforms.split(',').collect { it.trim() }
if (platforms.isEmpty() || platforms.any { !(it in ['fabric', 'forge']) } ||
        platforms.unique(false).size() != platforms.size()) {
    throw new GradleException('enabled_platforms must list fabric and/or forge once each.')
}
platforms.each { include it }
