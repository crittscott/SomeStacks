plugins {
    id 'dev.architectury.loom' version '1.17.491' apply false
    id 'architectury-plugin' version '3.5.169'
    id 'com.gradleup.shadow' version '9.4.3' apply false
}

architectury {
    minecraft = project.minecraft_version
}

ext.configureGameTestStructures = { Project loaderProject ->
    def structureSource = rootProject.layout.projectDirectory.file(
            'common/src/gametest/fixtures/empty_9x6x9.nbt.b64')
    def structureOutput = loaderProject.layout.buildDirectory.file(
            'generated/gametest/resources/data/somebuckets/structure/empty_9x6x9.nbt')

    loaderProject.tasks.register('generateGameTestStructures') {
        inputs.file(structureSource)
        outputs.file(structureOutput)

        doLast {
            def output = structureOutput.get().asFile
            output.parentFile.mkdirs()
            output.bytes = Base64.getMimeDecoder().decode(structureSource.asFile.text)
        }
    }

    loaderProject.sourceSets.gametest.resources {
        srcDir loaderProject.layout.buildDirectory.dir('generated/gametest/resources')
    }
    loaderProject.tasks.named('processGametestResources').configure {
        dependsOn loaderProject.tasks.named('generateGameTestStructures')
    }
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        maven { url = 'https://maven.ftb.dev/releases' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://maven.neoforged.net/releases/' }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
        }
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    tasks.withType(JavaExec).configureEach {
        javaLauncher.set(javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        })
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
