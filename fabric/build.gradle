plugins {
    id 'fabric-loom'
    id 'multiloader-loader'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "dev.architectury:architectury-fabric:${architectury_api_version}"

    // common's source uses javax.annotation.Nullable. Only common's source (not its
    // dependency jars) is pulled into this module, so this must be redeclared here even
    // though common itself already depends on it. Forge doesn't need this line: it gets
    // javax.annotation.Nullable transitively through ModDevGradle's own dependency chain,
    // which Fabric Loom's does not provide.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

loom {
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            runDir('run')
        }
        server {
            server()
            runDir('run')
        }
    }
}

processResources {
    def replaceProperties = [
            version: project.version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_description: mod_description,
            mod_authors: mod_authors,
            mod_license: mod_license,
            fabric_loader_version: fabric_loader_version,
            fabric_version: fabric_version,
            architectury_api_version: architectury_api_version,
            minecraft_version: minecraft_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
