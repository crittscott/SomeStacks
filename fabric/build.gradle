plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

rootProject.configureGameTests(project)

loom {
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
        somestacks_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gameTestServer {
            server()
            name 'Game Test Server'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get().asFile}/gametest-report.xml"
            source sourceSets.gametest
        }
    }
}

// The GameTest server reuses run/world between launches; clear it so blocks and entities left by
// one GameTest run cannot leak into the next.
def gameTestWorldDirectory = layout.projectDirectory.dir('run/world')
tasks.named('runGameTestServer').configure {
    doFirst {
        project.delete(gameTestWorldDirectory)
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    // Hosts FTB's mods, including the optional FTB Chunks compile-time dependency below.
    maven { url = 'https://maven.ftb.dev/releases' }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Optional: lets FtbChunksProtection compile against FTB Chunks' claim API. Never bundled and
    // not required at runtime; consulted only when the mod is actually installed.
    modCompileOnly "dev.ftb.mods:ftb-chunks-fabric:$rootProject.ftb_chunks_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

// Expands ${...} placeholders in fabric.mod.json (this module's own resource).
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = rootProject.sharedModProperties + [
            fabric_loader_version: fabric_loader_version,
            fabric_api_version: fabric_api_version,
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

// Expands ${...} placeholders in the gametest fabric.mod.json (this module's own resource).
tasks.named('processGametestResources', ProcessResources).configure {
    var replaceProperties = [
            mod_version          : mod_version,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version   : fabric_api_version,
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

// The production jar bundles common, so the sources jar carries common's sources as well.
sourcesJar {
    def commonSources = project(':common').tasks.named('sourcesJar')
    dependsOn commonSources
    from commonSources.flatMap { it.archiveFile }.map { zipTree(it) }
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
