plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

rootProject.configureGameTests(project)

loom {
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
        somestacks_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        clientGameTests {
            client()
            name 'Client Game Tests'
            runDir 'run-client-gametest'
            source sourceSets.gametest
        }
        gameTestServer {
            server()
            name 'Game Test Server'
            runDir 'run-gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get().asFile}/gametest-report.xml"
            source sourceSets.gametest
        }
    }
}

// Only the dedicated GameTest world's contents are disposable between test launches.
def gameTestRunDirectory = layout.projectDirectory.dir('run-gametest')
def gameTestWorldDirectory = gameTestRunDirectory.dir('world')
tasks.named('runGameTestServer').configure {
    doFirst {
        def runDirectory = gameTestRunDirectory.asFile.toPath().toAbsolutePath().normalize()
        def worldDirectory = gameTestWorldDirectory.asFile.toPath().toAbsolutePath().normalize()
        if (worldDirectory.parent != runDirectory || worldDirectory.fileName.toString() != 'world') {
            throw new GradleException('GameTest cleanup must stay inside run-gametest/world.')
        }
        project.delete(worldDirectory.toFile())
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    // Hosts FTB's Fabric mods, including the optional ftb-chunks-fabric compile-time dependency below.
    maven { url = 'https://maven.ftb.dev/releases' }
    // Hosts the optional open-parties-and-claims compile-time dependency below.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // Hosts the optional common-protection-api compile-time dependency below.
    maven { url = 'https://maven.nucleoid.xyz/' }
}

// -PwithCommonProtectionApi=true puts Common Protection API on the development runtime and runs
// the GameTests that need it in place of those that need it absent.
def withCommonProtectionApi = providers.gradleProperty('withCommonProtectionApi')
        .map { it.toBoolean() }.getOrElse(false)

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Optional: lets FtbChunksProtection compile against FTB Chunks' claim API. Never bundled and
    // not required at runtime; consulted only when the mod is actually installed.
    modCompileOnly "dev.ftb.mods:ftb-chunks-fabric:$rootProject.ftb_chunks_version"

    // Optional: lets OpacProtection compile against Open Parties and Claims' protection API. Never
    // bundled and not required at runtime; consulted only when the mod is actually installed.
    modCompileOnly "maven.modrinth:open-parties-and-claims:$rootProject.opac_version"

    // Optional: lets CommonProtectionQueries compile against Common Protection API. Never bundled
    // and not required at runtime; consulted only when the mod is actually installed.
    modCompileOnly("eu.pb4:common-protection-api:$rootProject.common_protection_api_version") {
        transitive = false
    }
    if (withCommonProtectionApi) {
        modRuntimeOnly("eu.pb4:common-protection-api:$rootProject.common_protection_api_version") {
            transitive = false
        }
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Expands ${...} placeholders in fabric.mod.json (this module's own resource).
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = rootProject.sharedModProperties + [
            fabric_loader_version: fabric_loader_version,
            fabric_api_version: fabric_api_version,
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties + [project: project]
    }
}

// Expands ${...} placeholders in the gametest dev-mod's own fabric.mod.json.
tasks.named('processGametestResources', ProcessResources).configure {
    var replaceProperties = [
            fabric_loader_version: fabric_loader_version, fabric_api_version: fabric_api_version,
            mod_version: mod_version,
            protection_api_gametest_entrypoint: withCommonProtectionApi
                    ? ',\n      "com.github.crittscott.somestacks.gametest.ProtectionApiGameTests"'
                    : ',\n      "com.github.crittscott.somestacks.gametest.NoProtectionApiGameTests"',
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties + [project: project]
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
