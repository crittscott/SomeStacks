plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

sourceSets {
    gametest {
        java { srcDir project(':common').file('src/gametest/java') }
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output +
                project(':common').sourceSets.main.output
    }
}

loom {
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
        somestacks_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gameTestServer {
            server()
            name 'Game Test Server'
            vmArg '-Dfabric-api.gametest'
            source sourceSets.gametest
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    // Hosts FTB's Fabric mods, including the optional ftb-chunks-fabric compile-time dependency below.
    maven { url = 'https://maven.ftb.dev/releases' }
    // Hosts the optional open-parties-and-claims compile-time dependency below.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // common's source uses javax.annotation.Nullable. Forge gets this transitively through its own
    // dependency chain; Fabric Loom's does not provide it, so it must be redeclared here even though
    // common itself already depends on it.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // Optional: lets FtbChunksProtection compile against FTB Chunks' claim API. Never bundled and
    // not required at runtime; consulted only when the mod is actually installed.
    modCompileOnly "dev.ftb.mods:ftb-chunks-fabric:$rootProject.ftb_chunks_version"

    // Optional: lets OpacProtection compile against Open Parties and Claims' protection API. Never
    // bundled and not required at runtime; consulted only when the mod is actually installed.
    modCompileOnly "maven.modrinth:open-parties-and-claims:$rootProject.opac_version"
}

// Expands ${...} placeholders in fabric.mod.json (this module's own resource).
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, fabric_loader_version: fabric_loader_version,
            fabric_api_version: fabric_api_version, architectury_api_version: architectury_api_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties + [project: project]
    }
}

// Expands ${...} placeholders in the gametest dev-mod's own fabric.mod.json.
tasks.named('processGametestResources', ProcessResources).configure {
    var replaceProperties = [
            fabric_loader_version: fabric_loader_version, fabric_api_version: fabric_api_version,
            mod_version: mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties + [project: project]
    }
}

def gameTestStructureSource = layout.projectDirectory.file(
        'src/gametest/fixtures/somestacks_empty.nbt.b64')
def gameTestStructureOutput = layout.buildDirectory.file(
        'generated/gametest/resources/data/somestacks/structures/somestacks_empty.nbt')

tasks.register('generateGameTestStructures') {
    inputs.file(gameTestStructureSource)
    outputs.file(gameTestStructureOutput)

    doLast {
        def output = gameTestStructureOutput.get().asFile
        output.parentFile.mkdirs()
        output.bytes = Base64.getDecoder().decode(gameTestStructureSource.asFile.text.trim())
    }
}

sourceSets.gametest.resources { srcDir layout.buildDirectory.dir('generated/gametest/resources') }
tasks.named('processGametestResources').configure {
    dependsOn tasks.named('generateGameTestStructures')
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
