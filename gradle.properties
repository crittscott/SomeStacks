# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

## Environment Properties

# The Minecraft version must agree with the Forge/NeoForge versions to get a valid artifact.
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1]

# Gradle needs one exact Forge artifact for compilation and development runs. Keep it aligned with
# the minimum supported runtime declared by forge_version_range below.
forge_compile_version=1.21.1-52.0.0
# Loader ranges are runtime compatibility declarations for loader metadata.
forge_version_range=[52.0.0,53)
# Forge's loader range uses the Forge/FML major version.
forge_loader_version_range=[52,53)

neoforge_compile_version=21.1.100
neoforge_version_range=[21.1.100,22)
# NeoForge's JavaFML loader has its own version independent of the NeoForge release number.
neoforge_loader_version_range=[1,)

# Mojang official mappings layered with Parchment. See https://parchmentmc.org/docs/getting-started
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Architectury Loom platforms built from the common module.
enabled_platforms=fabric,forge,neoforge
fabric_loader_version=0.16.0
fabric_api_version=0.102.0+1.21.1

# Optional compile-time dependency, consulted only if the mod is installed. See FtbChunksProtection.
# Hosted on FTB's own Maven (declared in the root build script's subproject repositories).
ftb_chunks_version=2101.1.21
ftb_chunks_version_range=[2101,2102)


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=somestacks
# The human-readable display name for the mod.
mod_name=Some Stacks
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=GNU GPLv3
# The mod version. See https://semver.org/
mod_version=0.8.0
# The base name for the produced artifacts, e.g. `somestacks-fabric`.
archives_name=somestacks
# The Maven group for the mod. This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
maven_group=com.github.crittscott.somestacks
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=crittscott
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Just stack it up!
