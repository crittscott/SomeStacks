plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    // Architectury API is not published to Maven Central; common declares a direct
    // dependency on it, so this module needs the repository too, not just the loader
    // convention (which redeclares it for forge/fabric's own architectury-forge/-fabric
    // artifacts).
    maven { url = 'https://maven.architectury.dev/' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// pack.mcmeta lives in common and is shared into both loader outputs; its ${mod_id}
// placeholder is expanded here since neither loader module owns this resource file.
def commonReplaceProperties = [
        mod_id: rootProject.property('mod_id'),
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties(commonReplaceProperties)

    filesMatching(['pack.mcmeta']) {
        expand commonReplaceProperties + [project: project]
    }
}
