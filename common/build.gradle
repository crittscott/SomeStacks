architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    modCompileOnly "dev.architectury:architectury:$rootProject.architectury_api_version"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Expands the ${mod_id} placeholder in pack.mcmeta once here, rather than duplicating the same
// filesMatching block in every loader that bundles this module's resources.
tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mod_id', mod_id

    filesMatching('pack.mcmeta') {
        expand mod_id: mod_id
    }
}
