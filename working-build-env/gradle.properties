# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties

# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
# Pinned to the only version this mod is built and tested against. The client rendering
# internals it hooks are not stable across 1.20.x.
minecraft_version_range=[1.20.1]
# Gradle's compilation and development-run dependency. Matches the minimum accepted runtime,
# so the two stay in agreement.
forge_compile_version=1.20.1-47.4.10
# The 1.20.1 Forge line from the compile baseline up; the mod uses no API added within it.
forge_version_range=[47.4.10,48)
# The loader version range can only use the major version of Forge/FML as bounds
loader_version_range=[47,48)
# Mojang official mappings layered with Parchment. See https://parchmentmc.org/docs/getting-started
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Architectury Loom platforms built from the common module.
enabled_platforms=fabric,forge
fabric_loader_version=0.19.3
fabric_api_version=0.92.11+1.20.1
architectury_api_version=9.2.14
architectury_version_range=[9.2.14,)

# Optional Fabric compile-time dependency, consulted only if the mod is installed. See
# FtbChunksProtection. Hosted on FTB's own Maven (declared in fabric/build.gradle).
ftb_chunks_version=2001.3.8
# Optional Fabric compile-time dependency, consulted only if the mod is installed. See
# OpacProtection. Resolved through Modrinth's Maven (declared in fabric/build.gradle).
opac_version=fabric-1.20.1-0.29.2


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=somestacks
# The human-readable display name for the mod.
mod_name=Some Stacks
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=GNU GPLv3
# The mod version. See https://semver.org/
mod_version=1.1.1
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.github.crittscott.somestacks
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=crittscott
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Just stack it up!
