plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
        somebuckets_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gameTestServer {
            server()
            environment 'gametestserver'
            forgeTemplate 'gameTestServer'
            name 'Game Test Server'
            property 'forge.enabledGameTestNamespaces', mod_id
            source sourceSets.gametest
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_compile_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    modCompileOnly "dev.ftb.mods:ftb-chunks-forge:${ftb_chunks_version}"
}

// GameTest structure templates are binary NBT. Keep the reviewable source as base64 and
// materialize it in build/ so the generated binary is never edited by hand.
def gameTestStructureSource = layout.projectDirectory.file('src/gametest/fixtures/empty_9x6x9.nbt.b64')
def gameTestStructureOutput = layout.buildDirectory.file(
        'generated/gametest/resources/data/somebuckets/structures/empty_9x6x9.nbt')

tasks.register('generateGameTestStructures') {
    inputs.file(gameTestStructureSource)
    outputs.file(gameTestStructureOutput)

    doLast {
        def output = gameTestStructureOutput.get().asFile
        output.parentFile.mkdirs()
        output.bytes = Base64.getDecoder().decode(gameTestStructureSource.asFile.text.trim())
    }
}

sourceSets.gametest.resources { srcDir layout.buildDirectory.dir('generated/gametest/resources') }
tasks.named('processGametestResources').configure { dependsOn tasks.named('generateGameTestStructures') }

// Expands ${...} placeholders in mods.toml (this module's own resource).
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range, loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties + [project: project]
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
