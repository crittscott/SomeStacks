plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

rootProject.configureGameTests(project)
sourceSets.main.resources.srcDir 'src/generated/resources'

loom {
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
        somebuckets_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        data {
            data()
            name 'Data'
            source sourceSets.main
            programArgs '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', rootProject.file('common/src/main/resources').absolutePath
        }

        gameTestServer {
            server()
            environment 'gametestserver'
            forgeTemplate 'gameTestServer'
            name 'Game Test Server'
            property 'forge.enabledGameTestNamespaces', mod_id
            source sourceSets.gametest
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    // Runs receive common through loom.mods; adding it to the runtime classpath as well puts its
    // packages in two modules, which the module system rejects.
    compileClasspath.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_compile_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

}

def commonAccessWidener = rootProject.file('common/src/main/resources/somebuckets.accesswidener')
def forgeAccessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
def commonAccessMirror = [
        'accessible field net/minecraft/world/entity/item/ItemEntity target Ljava/util/UUID;':
                'public net.minecraft.world.entity.item.ItemEntity target',
]

tasks.register('verifyCommonAccessMirror') {
    inputs.files(commonAccessWidener, forgeAccessTransformer)

    doLast {
        def commonEntries = commonAccessWidener.readLines('UTF-8')
                .collect { it.trim() }
                .findAll { it && !it.startsWith('#') && !it.startsWith('accessWidener ') }
                .toSet()
        if (commonEntries != commonAccessMirror.keySet()) {
            throw new GradleException('Update verifyCommonAccessMirror for the changed common access widener')
        }

        def forgeEntries = forgeAccessTransformer.readLines('UTF-8')
                .collect { it.trim() }
                .findAll { it && !it.startsWith('#') }
                .toSet()
        def missing = commonAccessMirror.values().findAll { !forgeEntries.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("Forge access transformer is missing common entries: $missing")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyCommonAccessMirror')
}

// Expands ${...} placeholders in mods.toml (this module's own resource).
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = rootProject.sharedModProperties + [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            forge_loader_version_range: forge_loader_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

// Expands ${...} placeholders in the gametest mods.toml (this module's own resource).
tasks.named('processGametestResources', ProcessResources).configure {
    var replaceProperties = [
            mod_license               : mod_license,
            forge_version_range       : forge_version_range,
            forge_loader_version_range: forge_loader_version_range,
            minecraft_version_range   : minecraft_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
